<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            margin-top: 100px;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>House Price Prediction</h2>

    <form action="/predict" method="post">
        <input type="text" name="rm" placeholder="Average number of rooms (RM)" required>
        <input type="text" name="lstat" placeholder="% lower status population (LSTAT)" required>
        <input type="text" name="ptratio" placeholder="Pupil-teacher ratio (PTRATIO)" required>
        <button type="submit">Predict</button>
    </form>

    <h3>{{ prediction_text }}</h3>
</div>

</body>
</html>
